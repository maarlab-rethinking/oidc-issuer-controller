{{- if and .Values.rbac.create .Values.rbac.namespacedSecretAccess }}
{{- range .Values.rbac.secretNamespaces | default (list .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oidc-issuer-controller.fullname" $ }}-secrets
  namespace: {{ . }}
  labels:
    {{- include "oidc-issuer-controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oidc-issuer-controller.fullname" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "oidc-issuer-controller.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
