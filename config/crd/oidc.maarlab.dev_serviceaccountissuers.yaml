apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: serviceaccountissuers.oidc.maarlab.dev
spec:
  group: oidc.maarlab.dev
  names:
    kind: ServiceAccountIssuer
    listKind: ServiceAccountIssuerList
    plural: serviceaccountissuers
    shortNames:
    - sai
    singular: serviceaccountissuer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.issuer
      name: Issuer
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastPublishedTime
      name: Published
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAccountIssuer publishes a cluster's ServiceAccount issuer discovery document and
          JWKS to an S3-compatible bucket served on the issuer's public host.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAccountIssuerSpec describes one cluster's ServiceAccount issuer and where it is
              published.
            properties:
              destination:
                description: Destination is where they are published.
                properties:
                  cacheControl:
                    default: max-age=300
                    description: |-
                      CacheControl is set on the uploaded objects. It bounds how long a CDN or a relying
                      party may keep a JWKS that no longer holds the current signing key.
                    type: string
                  s3:
                    description: S3 is the bucket the public issuer host serves.
                    properties:
                      bucket:
                        description: Bucket name.
                        maxLength: 63
                        minLength: 3
                        type: string
                      credentials:
                        description: Credentials for the bucket.
                        properties:
                          accessKeyIDKey:
                            default: access-key
                            description: Key holding the access key ID.
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                          secretAccessKeyKey:
                            default: secret-key
                            description: Key holding the secret access key.
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Endpoint of the S3 API, for example https://<account>.r2.cloudflarestorage.com.
                        pattern: ^https?://[^/?#]+/?$
                        type: string
                      forcePathStyle:
                        description: |-
                          ForcePathStyle addresses the bucket as <endpoint>/<bucket> instead of
                          <bucket>.<endpoint>. Some S3-compatible services, MinIO among them, need it.
                        type: boolean
                      region:
                        default: auto
                        description: Region used to sign requests. Cloudflare R2 takes
                          "auto".
                        type: string
                    required:
                    - bucket
                    - credentials
                    - endpoint
                    type: object
                required:
                - s3
                type: object
              issuer:
                description: |-
                  Issuer is the URL the cluster's API server declares as its ServiceAccount issuer
                  (--service-account-issuer). The controller refuses to publish when the cluster
                  declares another one, so a cluster cannot overwrite another cluster's documents.
                pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                type: string
                x-kubernetes-validations:
                - message: issuer is immutable; create another ServiceAccountIssuer
                  rule: self == oldSelf
              source:
                description: Source is where the documents are read from.
                properties:
                  kubeconfig:
                    description: Kubeconfig reads a remote cluster.
                    properties:
                      secretRef:
                        description: |-
                          SecretRef is the Secret, in the ServiceAccountIssuer's namespace, holding the
                          kubeconfig. Its current context selects the cluster and user; the user must be
                          allowed to get /.well-known/openid-configuration and /openid/v1/jwks.
                        properties:
                          key:
                            default: value
                            description: |-
                              Key holding the value. The default, value, is the key Cluster API uses in the
                              <cluster>-kubeconfig Secret it keeps for every cluster it creates.
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  local:
                    description: |-
                      Local reads the cluster the controller runs in, with the controller's own
                      ServiceAccount. Kubernetes lets every ServiceAccount read the discovery documents.
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of local or kubeconfig
                  rule: has(self.local) != has(self.kubeconfig)
              verifyServed:
                default: true
                description: |-
                  VerifyServed makes the controller fetch the public issuer URL after publishing and
                  check it serves the documents just written. It catches what the bucket cannot show:
                  a missing custom domain, a bad certificate, a stale cache.
                type: boolean
            required:
            - destination
            - issuer
            - source
            type: object
          status:
            description: ServiceAccountIssuerStatus is the observed state.
            properties:
              conditions:
                description: 'Conditions: Ready, SourceRead, Published and Served.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jwksURI:
                description: JWKSURI is the jwks_uri the cluster's discovery document
                  declares.
                type: string
              keyIDs:
                description: KeyIDs are the key IDs in the published JWKS.
                items:
                  type: string
                type: array
              lastPublishedTime:
                description: LastPublishedTime is when the controller last wrote a
                  changed document.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec the
                  status describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
